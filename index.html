<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"">
  <title>ikaramz의 IT 성장 기록 Blog</title>
  <style>
     /* 블로그 전체 설정 */
    body {
        font-family: 'Malgun Gothic', sans-serif /* 한국어에 깔끔한 font*/
        line-height: 1.6;
        margin: 40px auto;
        padding: 0 20px; 
        background-color: #ffe0e9; /* 연한 핑크 background */
        color: black;              /* 기본 글씨색을 검정으로 설정 */
    }

    /* 메인 제목 (상단 환영 인사) */
    h1 { 
        color: black;   /* Pinkcolor였던 제목을 Black으로 변경 */
        border-bottom: 2px solid #ffb6c1; /* 아래 줄도 Pink Color 계열로 매칭 */
        padding-bottom: 10px;
       }

    /* 개별 Post Box 설정 */
    .post {
        margin-bottom: 30px;
        border: 1px solid #ffb6c1;   /* Box 테두리고 Pink color 계열 */
        padding: 20px; 
        border-radius: 8px; 
        background-color: white;     /* Post 내용은 잘 보이게 White Background */
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1); /*약간의 Shadow Effective */
    }

    /* Post Subject */
    .post h2 {
        color: black;
        margin-top: 0;
    }

    /* 작성일 (Gray 에서 좀 더 진하게) */
    small {
        color: #555;
    }   
  </style>
  
</head>
  <body>
      <h1> 반갑습니다. ikaramz Blog에 오신 걸 환영합니다. </h1>

      <div class="post">
            <h2>첫 번째 기록: Blog Start!</h2>
            <p>오늘 드디어 GitHub Blog를 개설 했습니다. 기본기가 탄탄한 해커가 되겠습니다.</p>
            <small> 작성일 : 2026년 3월 30일</small>
      </div>
  </body>
</html>
