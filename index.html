<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ikaramz의 IT 성장 기록 Blog</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    body {
        font-family: 'IBM Plex Mono', 'Nanum Gothic Coding', monospace;
        line-height: 1.8;
        margin: 0;
        padding: 0; 
        background-color: #FFF0F2; 
        color: #333;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
    }

    h1.blog-title { 
        color: #FF8DA1; 
        font-size: 2.0em;
        font-weight: 500;
        margin-bottom: 30px;
        border-bottom: 2px solid #FFF0F2;
        padding-bottom: 10px;
    }

    h2.post-title {
        font-size: 1.5em;
        color: #222;
        margin-top: 0;
        margin-bottom: 15px;
    }

    p { color: #444; margin-bottom: 25px; }

    .post-date {
      display: block;
      font-size: 0.85em;
      color: #aaa;
      text-align: right;
      margin-top: 20px;
    }   

    /* --- [새로 추가된 Contact 스타일] --- */
    .contact-section {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px dashed #FFB7C5; /* 점선으로 구분 */
      text-align: center;
    }

    .contact-title {
      font-size: 1.1em;
      font-weight: 700;
      color: #FF8DA1;
      margin-bottom: 15px;
      display: block;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 20px; /* 아이콘/링크 사이 간격 */
    }

    .contact-item {
      text-decoration: none;
      color: #666;
      font-size: 0.9em;
      transition: all 0.3s ease;
      padding: 5px 10px;
      border-radius: 5px;
      background: #FFF9FA;
    }

    /* 마우스를 올렸을 때(Hover) 효과 */
    .contact-item:hover {
      color: #ffffff;
      background-color: #FF8DA1; /* 에이프릴 핑크로 반전 */
      transform: translateY(-3px); /* 살짝 떠오르는 효과 */
    }
  </style>
</head>
<body>
  <div style="text-align: center; margin-top: 20px;">
    <img id="random-img" src="images/r2.jpg" width="500" style="border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
</div>
  <div class="container">
      <h1 class="blog-title">반갑습니다. ikaramz Blog에 오신 걸 환영합니다.</h1>

      <div class="post">
            <h2 class="post-title">첫 번째 기록: Blog Start!</h2>
            <p>오늘 드디어 GitHub Blog를 개설했습니다. 기본기가 탄탄한 해커가 되겠습니다.</p>
            <small class="post-date">작성일 : 2026년 3월 30일</small>
      </div>

      <footer class="contact-section">
          <span class="contact-title">Connect with Me</span>
          <div class="contact-links">
              <a href="mailto:your-email@gmail.com" class="contact-item">📧 Email</a>
              <a href="https://github.com/your-id" target="_blank" class="contact-item">💻 GitHub</a>
              <a href="#" class="contact-item">📝 Blog Info</a>
          </div>
      </footer>
      </div>

</body>
</html>
