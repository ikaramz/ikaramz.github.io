<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ikaramz의 IT 성장 기록 Blog</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

    /* 1. 블로그 전체 설정 */
    body {
        /* 영문은 IBM Plex Mono, 한글은 나눔고딕 코딩을 우선 적용 */
        font-family: 'IBM Plex Mono', 'Nanum Gothic Coding', monospace;
        line-height: 1.8;
        margin: 0;
        padding: 0; 
        background-color: #FFF0F2; 
        color: #333;
    }

    /* 2. 메인 컨테이너 */
    .container {
      max-width: 800px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
    }

    /* 3. 블로그 제목 (에이프릴 로열 핑크 포인트) */
    h1.blog-title { 
        color: #FF8DA1; 
        font-size: 2.0em; /* 폰트 특성에 맞춰 약간 조절 */
        font-weight: 500;
        margin-bottom: 30px;
        border-bottom: 2px solid #FFF0F2;
        padding-bottom: 10px;
        letter-spacing: -0.5px; /* 글자 간격 살짝 좁힘 */
    }

    /* 4. 포스팅 제목 */
    h2.post-title {
        font-size: 1.5em;
        color: #222;
        margin-top: 0;
        margin-bottom: 15px;
        font-weight: 700;
    }

    /* 5. 본문 내용 */
    p {
      color: #444;
      margin-bottom: 25px;
      word-break: keep-all;
    }

    /* 6. 작성일 */
    .post-date {
      display: block;
      font-size: 0.85em;
      color: #aaa;
      text-align: right;
      margin-top: 20px;
    }   
  </style>
</head>
<body>

  <div class="container">
      <h1 class="blog-title">반갑습니다. ikaramz Blog에 오신 걸 환영합니다.</h1>

      <div class="post">
            <h2 class="post-title">첫 번째 기록: Blog Start!</h2>
            <p>오늘 드디어 GitHub Blog를 개설했습니다. 기본기를 중시하는 해커가 되겠습니다.</p>
            <small class="post-date">작성일 : 2026년 3월 30일</small>
      </div>
  </div>

</body>
</html>
